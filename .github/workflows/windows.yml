name: Validar Windows e empacotar sob solicitação
on:
  workflow_dispatch:
    inputs:
      gerar_pacote:
        description: Gerar pacote completo e instalador (somente quando solicitado)
        type: boolean
        required: false
        default: false
  push:
    branches: [main]
  pull_request:
jobs:
  tests:
    name: Testes Windows
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preparar ambiente de testes
        shell: pwsh
        run: |
          python -m pip install -r requirements-dev.lock
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install --no-build-isolation --no-deps -e .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Executar testes
        shell: pwsh
        run: python -m pytest -q -o faulthandler_timeout=30
  package:
    name: Pacote Windows solicitado
    needs: tests
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.gerar_pacote == true }}
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Garantir compilador do instalador
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Falha na instalação do Inno Setup' }
          }
      - name: Compilar e verificar pacote
        shell: pwsh
        run: ./packaging/build-windows.ps1
      - name: Verificar instalação e preservação de dados
        shell: pwsh
        run: ./packaging/test-windows-installer.ps1 -DisposableRunner -SetupPath dist/installer/DrHeekLab-2.9.10-Beta-Setup.exe
      - uses: actions/upload-artifact@v4
        with:
          name: DrHeekLab-Windows-2.9.10-Beta
          path: |
            dist/LEIA-ME.txt
            dist/DrHeekLab/
            dist/installer/*.exe
            dist/installer/SHA256.txt
            dist/windows-package-qa.json
            dist/installer-qa/
            dist/test-results.xml
            dist/windows-SHA256.txt
            dist/DrHeekLabUpdate.exe
            dist/windows-pytest*.log
